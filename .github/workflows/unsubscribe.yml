name: process-unsubscribe

# CPO 구독 해지 토큰 처리 (2026-08-11 구독시스템 스펙, Open Item 2 결정).
# 이메일 unsubscribe 링크는 mailto:라 자동 트리거가 안 됨 — 운영자가 메일로 받은 토큰을
# 여기 input으로 넣어 수동 실행한다. 신규 workflow_dispatch 워크플로는 main 브랜치에 있어야만
# Actions 탭 "Run workflow" 드롭다운에 노출됨(20260717 세션에서 확인된 제약) — main 병합 필요.

on:
  workflow_dispatch:
    inputs:
      token:
        description: "구독 해지 요청 메일에 담긴 unsubscribe_token"
        required: true
        type: string

jobs:
  unsubscribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git push를 위해 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Process unsubscribe token
        run: python scripts/process_unsubscribe.py --token "${{ inputs.token }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers/subscribers.json
          git diff --staged --quiet || git commit -m "chore: process unsubscribe request"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
